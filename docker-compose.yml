services:
  indy-pool:
    build:
      context: .
      dockerfile: network/indy-pool.dockerfile
    ports:
      - '9701-9708:9701-9708'
    command: >
      /bin/bash -ec "
        rm -f /tmp/indy-pool-ready;
        /usr/bin/supervisord &
        indy-cli-setup &&
        add-did-from-seed 00000000000000000000000Endorser9 ENDORSER &&
        add-did-from-seed 000000000000000000000000Trustee9 TRUSTEE &&
        touch /tmp/indy-pool-ready &&
        wait
      "
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/indy-pool-ready']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
