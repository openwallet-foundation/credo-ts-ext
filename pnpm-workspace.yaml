packages:
  - packages/*
  - samples/*

allowBuilds:
  '@hyperledger/anoncreds-nodejs': true
  '@hyperledger/indy-vdr-nodejs': true
  '@openwallet-foundation/askar-nodejs': true
  cbor-extract: true
  koffi: true
  protobufjs: false
  secp256k1: false
  zstd-napi: true

catalog:
  '@biomejs/biome': 2.5.14
  # Keep the cheqd dependencies aligned with the versions supported by @cheqd/sdk-esm.
  '@cheqd/sdk': npm:@cheqd/sdk-esm@5.5.1
  '@cheqd/ts-proto': ^4.2.0
  '@cosmjs/crypto': ^0.36.2
  '@cosmjs/proto-signing': ^0.36.2
  '@cosmjs/stargate': ^0.36.2
  # End @cheqd/sdk-esm-supported dependency versions.
  '@credo-ts/anoncreds': 0.8.0-alpha-20261118122511
  '@credo-ts/askar': 0.8.0-alpha-20261118122511
  '@credo-ts/core': 0.8.0-alpha-20261118122511
  '@credo-ts/node': 0.8.0-alpha-20261118122511
  '@hyperledger/anoncreds-nodejs': 0.5.0
  '@hyperledger/indy-vdr-nodejs': ^0.3.0
  '@hyperledger/indy-vdr-shared': ^0.3.0
  '@openwallet-foundation/askar-nodejs': 0.7.0
  '@types/node': ^22.19.0
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/coverage-v8': ^5.0.5
  class-transformer: 0.5.1
  class-validator: ^0.14.3
  reflect-metadata: 0.2.2
  rxjs: ^7.8.2
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.0.5

minimumReleaseAgeExclude:
  - '@hyperledger/anoncreds-nodejs@0.5.0'
  - '@hyperledger/anoncreds-shared@0.5.0'
  - '@credo-ts/anoncreds@0.8.0-alpha-20261118122511'
  - '@credo-ts/askar@0.8.0-alpha-20261118122511'
  - '@credo-ts/core@0.8.0-alpha-20261118122511'
  - '@credo-ts/didcomm@0.8.0-alpha-20261118122511'
  - '@credo-ts/node@0.8.0-alpha-20261118122511'
  - '@openwallet-foundation/askar-nodejs@0.7.0'
  - '@openwallet-foundation/askar-shared@0.7.0'
